    <title>NEXUS Network Monitor</title>

    <meta property="og:title" content="NEXUS Network Monitor" />
    <meta property="og:description" content="On-premises enterprise LAN infrastructure monitoring, asset discovery, and network telemetry console for system administrators." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Vite HMR is disabled in AI Studio preview. Provide quiet stub for 'vite-hmr' socket.
      (function() {
        if (typeof window === 'undefined') return;
        const RealWebSocket = window.WebSocket;
        if (RealWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHmr = protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.includes('vite-hmr'));
            if (isViteHmr) {
              const listeners = {};
              return {
                readyState: 1, // OPEN
                OPEN: 1, CONNECTING: 0, CLOSING: 2, CLOSED: 3,
                url: url,
                protocol: 'vite-hmr',
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(fn, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(f => f !== fn);
                  }
                },
                dispatchEvent: function() { return true; }
              };
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            (String(event.reason.message).includes('WebSocket') ||
             String(event.reason.stack).includes('@vite/client') ||
             String(event.reason.stack).includes('createWebSocketModuleRunnerTransport'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>

  </body>
